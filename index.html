<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Frameworks: a field guide</title>
  <meta name="description" content="25 product management frameworks in 6 families, each explained with a worked example and a tool to try it, plus guides for choosing between them.">
  <meta name="theme-color" content="#fbf9f4">
  <script>
    /* Set the theme before first paint: a saved choice, else the system setting. */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('pmf-theme'); } catch (e) { /* storage blocked */ }
      document.documentElement.setAttribute('data-theme', saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
