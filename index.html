<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Frameworks — A Field Guide</title>
  <meta name="description" content="A field guide to 24 product-management frameworks across 6 categories. Look one up, practice it, or compare your options — the right tool for the job.">
  <meta name="theme-color" content="#fcfaf4">
  <script>
    /* Set theme before first paint to avoid a flash. Honors a saved
       choice, else the OS preference. */
    (function () {
      try {
        var saved = localStorage.getItem('pmf-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
